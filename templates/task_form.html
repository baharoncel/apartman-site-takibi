{% extends 'base.html' %}
{% block title %}Yeni İş Emri - AidatPro{% endblock %}
{% block page_title %}İş Emri / Görev Ata{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1.5rem;">
            <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Görevlendirilecek Personel</label>
            {{ form.staff }}
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Görev Başlığı</label>
            <input type="text" name="title" required placeholder="Örn: Asansör periyodik bakım kontrolü" style="width:100%; padding:0.75rem; border-radius:0.5rem; border:1px solid var(--border-color); background: rgba(255,255,255,0.5); color:var(--text-main);">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Görev Detayı</label>
            <textarea name="description" rows="3" required placeholder="Göreve dair yapılacak işlerin detaylarını yazın..." style="width:100%; padding:0.75rem; border-radius:0.5rem; border:1px solid var(--border-color); background: rgba(255,255,255,0.5); color:var(--text-main);"></textarea>
        </div>
        <button type="submit" style="background:var(--primary); color:white; padding:0.75rem 1.5rem; border:none; border-radius:0.5rem; cursor:pointer; font-weight:600; width:100%;">Görevi Ata</button>
    </form>
</div>

<style>
    select {
        width: 100%;
        padding: 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border-color);
        background: rgba(255,255,255,0.5);
        color: var(--text-main);
    }
</style>
{% endblock %}
